services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pytorch_app
    working_dir: /workspace
    volumes:
      - ./dataset:/workspace/dataset
      - ./models:/workspace/models
      - ./inference:/workspace/inference
      - ./app:/workspace/app
      - ./requirements.txt:/workspace/requirements.txt
      - ./notebook_clean.ipynb:/workspace/notebook_clean.ipynb
      - ./run_pipeline.py:/workspace/run_pipeline.py
      - ./run_experiments.py:/workspace/run_experiments.py
      - ./.env:/workspace/.env
      - ./logs:/workspace/logs
      - ./results:/workspace/results
      - ./experiments:/workspace/experiments
    ports:
      - "8888:8888"
    shm_size: "16g"
    devices:
      - nvidia.com/gpu=all
    command: [ "jupyter", "notebook", "--ip=0.0.0.0", "--port=8888", "--allow-root", "--no-browser", "--NotebookApp.token=''", "--NotebookApp.password=''" ]
