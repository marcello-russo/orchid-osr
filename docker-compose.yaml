# Development compose - fast iteration with volume mounts
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pytorch_dev
    working_dir: /workspace
    volumes:
      # Code - hot reload enabled
      - ./app:/workspace/app
      - ./requirements.txt:/workspace/requirements.txt
      # Data (read-only for safety)
      - ./dataset:/workspace/dataset:ro
      - ./models:/workspace/models:ro
      - ./models_1:/workspace/models_1:ro
      # Output directories
      - ./inference:/workspace/inference
      - ./logs:/workspace/logs
      - ./results:/workspace/results
      # Notebooks
      - ./notebook_clean.ipynb:/workspace/notebook_clean.ipynb
      # Env
      - ./.env:/workspace/.env:ro
    shm_size: "16g"
    environment:
      - PYTHONUNBUFFERED=1
    develop:
      watch:
        - action: rebuild
          path: requirements.txt
    devices:
      - nvidia.com/gpu=all
    # Interactive shell - use: podman compose -f docker-compose.dev.yaml run app bash
    stdin_open: true
    tty: true
