services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - API_PORT=7860
      - HF_TOKEN=${HF_TOKEN}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - orchid-data:/data

volumes:
  orchid-data:
