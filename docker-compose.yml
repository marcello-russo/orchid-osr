services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu
    restart: unless-stopped
    expose:
      - "7860"
    environment:
      - API_PORT=7860
      - HF_TOKEN=${HF_TOKEN}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - orchid-data:/data
    networks:
      - orchid-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - orchid-net

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --config /home/nonroot/.cloudflared/config.yml run
    volumes:
      - ~/.cloudflared:/home/nonroot/.cloudflared
    depends_on:
      - nginx
    networks:
      - orchid-net

volumes:
  orchid-data:

networks:
  orchid-net:
    driver: bridge
