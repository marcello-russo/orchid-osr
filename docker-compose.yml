name: orchid-osr

services:
  backend:
    image: orchid-osr-backend:2026.11.09
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "7860"
    environment:
      - API_PORT=7860
      - HF_HOME=/data/.hf_cache
      - HF_TOKEN=${HF_TOKEN}
      - SUPERADMIN_USERNAME=${SUPERADMIN_USERNAME}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - orchid-data:/data
    networks:
      - orchid-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.31.2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - orchid-net

  tunnel:
    image: cloudflare/cloudflared:2026.7.1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: tunnel --config /home/nonroot/.cloudflared/config.yml run
    volumes:
      - /home/user/.cloudflared:/home/nonroot/.cloudflared
    depends_on:
      - nginx
    networks:
      - orchid-net

volumes:
  orchid-data:
    name: orchid-osr_orchid-data

networks:
  orchid-net:
    driver: bridge
