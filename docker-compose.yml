services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu
    restart: unless-stopped
    expose:
      - "7860"
    environment:
      - API_PORT=7860
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - orchid-data:/data
    networks:
      - orchid-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://backend:7860
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - orchid-net

volumes:
  orchid-data:

networks:
  orchid-net:
    driver: bridge
