services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - API_PORT=7860
      - API_RELOAD=true
    volumes:
      - ./backend/app:/workspace/backend/app
      - ./backend/server.py:/workspace/backend/server.py
      - ./backend/cli.py:/workspace/backend/cli.py
      - ./frontend/dist:/workspace/backend/frontend/dist
      - dataset:/workspace/backend/dataset
      - models:/workspace/backend/models
      - experiments:/workspace/backend/experiments

  gpu:
    profiles: [gpu]
    build:
      context: .
      dockerfile: Dockerfile
      target: gpu
    env_file:
      - .env
    environment:
      - API_PORT=7860
    volumes:
      - ./backend:/workspace/backend
      - dataset:/workspace/backend/dataset
      - models:/workspace/backend/models
      - experiments:/workspace/backend/experiments
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  train:
    profiles: [train]
    build:
      context: .
      dockerfile: Dockerfile
      target: training
    env_file:
      - .env
    environment:
      - HF_HOME=/workspace/backend/.hf_cache
      - TORCH_HOME=/workspace/backend/.torch_cache
    volumes:
      - ./backend:/workspace/backend
      - dataset:/workspace/backend/dataset
      - models:/workspace/backend/models
      - experiments:/workspace/backend/experiments
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["./scripts/cloud-train.sh"]

volumes:
  dataset:
  models:
  experiments:
