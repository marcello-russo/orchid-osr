# Training GPU — compose separato, non tocca il deploy (cpu) in produzione.
#
# Uso (serve NVIDIA Container Toolkit + driver >= 530 per CUDA 12.1):
#   HF_TOKEN=... docker compose -f docker-compose.yml -f docker-compose.gpu.yml run --rm --gpus all training \
#     python cli.py --cross-validate --exp 1 --model resnet18
#
# Il dataset NON e' baked nell'immagine: montare la cartella locale
# (o scaricarla da hub all'avvio con `orchid hf download`).
# I risultati restano su ./backend/experiments dell'host (bind mount).

services:
  training:
    build:
      context: .
      dockerfile: Dockerfile
      target: training
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - EXPERIMENTS_DIR=/workspace/backend/experiments
      - PYTHONUNBUFFERED=1
    volumes:
      # dataset locale (lettura) + experiments dell'host (scrittura)
      - ./backend/dataset:/workspace/backend/dataset:ro
      - ./backend/experiments:/workspace/backend/experiments
    working_dir: /workspace/backend
    networks:
      - orchid-net
