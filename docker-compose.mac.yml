services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.mac
    container_name: pytorch_app_mac
    working_dir: /workspace
    volumes:
      - ./dataset:/workspace/dataset
      - ./models:/workspace/models
      - ./inference:/workspace/inference
      - ./app:/workspace/app
      - ./requirements.txt:/workspace/requirements.txt
      - ./notebook.ipynb:/workspace/notebook.ipynb
      - ./.env:/workspace/.env
      - ./logs:/workspace/logs
      - ./results:/workspace/results
    ports:
      - "8888:8888"
      - "5000:5000"
    shm_size: "4g"
    # No devices/nvidia runtime needed for Mac/CPU
