# Deploy diretto sulla VPS via SSH (il repo non ha DISPATCH_TOKEN: l'utente è
# member dell'org, non owner, quindi non può creare repository secrets).
# Promozione solo esplicita: pubblicare la Release deploya quel tag.
# L'host non ha il sorgente: compose.yml ed edge.yml arrivano da qui, la VPS fa
# solo `pull` + `up -d`. Rollback = Release con il tag precedente.
name: Deploy VPS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da deployare (es. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          [ -n "$TAG" ] || { echo "::error::tag mancante"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "deploying $TAG"

      # compose.yml ed edge.yml viaggiano dal repo all'host (assets):
      # l'host è cache, il repo è la fonte di verità.
      - name: Upload compose assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "compose.yml,edge.yml"
          target: /srv/orchid
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TAG
          command_timeout: 12m
          script: |
            set -eu
            cd /srv/orchid

            PREV=$(sed -n 's/^ORCHID_VERSION=//p' .env | tail -n1)
            echo "deploy $TAG (versione precedente: ${PREV:-nessuna})"
            sed -i "s|^ORCHID_VERSION=.*|ORCHID_VERSION=$TAG|" .env

            docker compose pull
            docker compose up -d

            for i in $(seq 1 36); do
              if curl -fsS -o /dev/null https://osr.marrusso.dev/health; then
                echo "health OK dopo ~$((i * 5))s"
                docker compose ps
                exit 0
              fi
              sleep 5
            done

            echo "::error::healthcheck fallito su https://osr.marrusso.dev/health"
            docker compose logs --tail 80 app || true
            if [ -n "${PREV:-}" ]; then
              echo "::warning::rollback a $PREV"
              sed -i "s|^ORCHID_VERSION=.*|ORCHID_VERSION=$PREV|" .env
              docker compose pull && docker compose up -d
            fi
            exit 1
