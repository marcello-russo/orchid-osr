# Publish su GHCR con il GITHUB_TOKEN del repo: nessun secret aggiuntivo.
# Su tag v*: build dell'immagine unica (stage `runtime`, CPU) e push.
# Il deploy è un passo separato e solo esplicito: vedi deploy-vps.yml.
name: Publish Docker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da (ri)costruire (es. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  # Slug minuscolo: GHCR rifiuta i repository name con maiuscole,
  # e `github.repository` restituisce "squidslab/OrchID".
  IMAGE: ghcr.io/squidslab/orchid-app

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publishing $TAG"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
