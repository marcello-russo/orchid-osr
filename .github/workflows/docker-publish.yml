# Publish delegata al dispatcher centrale (marcello-russo/actions).
#
# Su tag `v*` questo job manda solo un segnale: build, push su GHCR, Release e
# prune avvengono nel repo `actions`, sul suo runner e con i suoi secret. Qui
# resta `DISPATCH_TOKEN`: nessun token di registry, nessuna chiave SSH.
#
# Flusso completo: `git tag vX.Y.Z && git push origin vX.Y.Z` → immagine
# pubblicata → Release pubblicata (draft_release=false) → deploy su VPS
# (deploy-vps.yml, innescato dalla Release).
#
# `services` è la mappa dei path→servizio del dispatcher: un tag che tocca solo
# benign (docs, CI, compose, scripts/) ri-tagga l'immagine precedente in pochi
# secondi; un tag che tocca `backend/**` o `frontend/**` ricompila.
name: Publish Docker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag esistente da (ri)costruire (es. v0.9.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `ref` esplicito: su dispatch `github.sha` sarebbe l'HEAD di main, non
      # il commit del tag che si sta ricostruendo.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          fetch-depth: 1

      - name: Dispatch build al repo actions
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          SHA="$(git rev-parse HEAD)"
          # Un servizio solo: l'immagine `app` (stage runtime). I path sono
          # quelli che un `COPY` porta nell'immagine: fuori da qui ogni file è
          # benign e il dispatcher ri-tagga invece di ricompilare.
          gh api repos/marcello-russo/actions/dispatches \
            -f event_type=docker-publish \
            -f client_payload[repo]="${{ github.repository }}" \
            -f client_payload[sha]="$SHA" \
            -f client_payload[tag]="$TAG" \
            -f client_payload[services]='[{"service":"app","context":".","dockerfile":"Dockerfile","paths":["backend/**","frontend/**","entrypoint.sh","Dockerfile"]}]' \
            -f client_payload[keep_versions]=3 \
            -f client_payload[draft_release]=false
          echo "dispatch publish $TAG ($SHA) inviato"
