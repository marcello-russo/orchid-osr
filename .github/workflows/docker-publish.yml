# Rilascio di OrchID OSR: un tag = una versione pubblicata.
#
# Il tag `vX.Y.Z` è l'unico atto deliberato: da lì la CI costruisce l'immagine
# unica (`runtime`, CPU), la pubblica su GHCR, crea la GitHub Release con le
# note generate dai commit e pota le versioni vecchie del pacchetto. Il deploy
# è un passo separato e locale (`scripts/deploy-vps.sh`, la VPS risponde solo
# sulla tailnet): prende compose.yml ed edge.yml *dal tag*, non dal working tree.
#
# Stesso contratto di `personale/actions` (docs/docker-publish.md), ridotto a
# un servizio solo: nessun `latest`, nessun build dall'host, rollback = tag
# precedente.
name: Publish Docker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag esistente da (ri)pubblicare (es. v0.2.4)"
        required: true
        type: string

# contents: write → Release; packages: write → push e prune su GHCR.
permissions:
  contents: write
  packages: write

env:
  # Slug minuscolo: GHCR rifiuta i repository name con maiuscole,
  # e `github.repository` restituisce "squidslab/OrchID".
  IMAGE: ghcr.io/squidslab/orchid-app
  PACKAGE: orchid-app
  OWNER: squidslab
  # Versioni GHCR tenute per il rollback (oltre a quella appena pubblicata).
  # Mai scendere sotto 3: rollback reale = tag precedente con immagine viva.
  KEEP_VERSIONS: "3"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF#refs/tags/}"
          # Il tag deve esistere davvero: un dispatch con un refuso non deve
          # creare un'immagine con una versione inventata.
          git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null \
            || { echo "::error::tag $TAG inesistente nel repo"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short "$TAG")" >> "$GITHUB_OUTPUT"
          echo "publishing $TAG ($(git rev-parse --short "$TAG"))"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: GitHub Release (note generate dai commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          # Il checkout qui è sul commit del tag quando il run nasce da un push
          # di tag; su dispatch il tag va recuperato esplicitamente, altrimenti
          # `--verify-tag` fallisce. `--generate-notes` usa comunque la API.
          git fetch --tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG già presente: nessuna modifica"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
            echo "release $TAG creata"
          fi

  prune:
    # Housekeeping, non un gate: se il token non può cancellare (permessi del
    # pacchetto) il deploy resta valido e il run resta verde con un warning.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tieni le ultime ${{ env.KEEP_VERSIONS }} versioni taggate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ env.OWNER }}
          PACKAGE: ${{ env.PACKAGE }}
          KEEP: ${{ env.KEEP_VERSIONS }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.error, urllib.request

          token, owner = os.environ["GH_TOKEN"], os.environ["OWNER"]
          pkg, keep = os.environ["PACKAGE"], int(os.environ["KEEP"])

          def api(method, path):
              req = urllib.request.Request(
                  f"https://api.github.com{path}", method=method,
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.urlopen(req) as r:
                      body = r.read().decode()
                      return json.loads(body) if body else True
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return None
                  raise

          versions = api("GET", f"/orgs/{owner}/packages/container/{pkg}/versions?per_page=100") or []
          # MAI cancellare versioni untagged: sono manifest figli dell'indice
          # (buildx pusha indice + figli come record separati). Cancellarli =
          # tag che esiste ma manifest 404 al pull.
          tagged = [v for v in versions
                    if v.get("metadata", {}).get("container", {}).get("tags")]
          tagged.sort(key=lambda v: v["created_at"], reverse=True)
          for v in tagged[keep:]:
              tags = ",".join(v["metadata"]["container"]["tags"])
              try:
                  api("DELETE", f"/orgs/{owner}/packages/container/{pkg}/versions/{v['id']}")
                  print(f"eliminata versione [{tags}] del {v['created_at']}")
              except urllib.error.HTTPError as e:
                  if e.code in (403, 404):
                      print(f"::warning::prune non permesso ({e.code}) su [{tags}]: "
                            f"servono admin del pacchetto; il deploy non è toccato")
                      break
                  raise
          print(f"tenute {min(keep, len(tagged))} versioni taggate "
                f"(+{len(versions) - len(tagged)} untagged preservate)")
          EOF
