name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install ".[dev]"
      - run: ruff check app/ tests/ scripts/
      - run: ruff format --check app/ tests/ scripts/ --diff
      - run: pytest -x -q --cov=app --cov=scripts --cov-report=term --cov-fail-under=30

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n entrypoint.sh
      - name: Python syntax check
        run: python3 backend/scripts/ci/check_syntax.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and cache
        uses: docker/build-push-action@v6
        with:
          target: cpu
          tags: orchid-ncd
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test — health endpoint
        run: |
          container_id=$(docker run -d orchid-ncd)
          for i in $(seq 1 12); do
            sleep 5
            if docker exec "$container_id" python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')" 2>/dev/null; then
              echo "OK: health endpoint risponde dopo $((i*5))s"
              docker rm -f "$container_id" || true
              exit 0
            fi
            status=$(docker inspect "$container_id" --format='{{.State.Status}}')
            if [ "$status" = "exited" ]; then
              echo "FAIL: container exited (code $(docker inspect "$container_id" --format='{{.State.ExitCode}}'))"
              docker logs "$container_id" || true
              docker rm -f "$container_id" || true
              exit 1
            fi
          done
          echo "FAIL: health endpoint non risponde dopo 60s"
          docker logs "$container_id" || true
          docker rm -f "$container_id" || true
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, docker, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/OrchID
            git pull origin main
            cd frontend
            npm run build 2>&1
            cd ..
            sudo docker compose build backend 2>&1
            sudo docker compose up -d backend nginx 2>&1
