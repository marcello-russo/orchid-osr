name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install ".[dev]"
      - run: ruff check app/ tests/ scripts/
      - run: ruff format --check app/ tests/ scripts/ --diff
      - run: pytest -x -q --cov=app --cov=scripts --cov-report=term --cov-fail-under=40

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n entrypoint.sh
      - name: Python syntax check
        run: python3 backend/scripts/ci/check_syntax.py
      - run: docker build --target=cpu -t orchid-ncd .
      - name: Smoke test — avvio container
        run: |
          container_id=$(docker run -d orchid-ncd)
          for i in 5 15 30 45; do
            sleep $i
            status=$(docker inspect "$container_id" --format='{{.State.Status}}' 2>/dev/null)
            if [ "$status" = "running" ]; then
              echo "OK: container running after ${i}s"
              docker rm -f "$container_id" || true
              exit 0
            fi
            if [ "$status" = "exited" ]; then
              echo "FAIL: container exited (code $(docker inspect "$container_id" --format='{{.State.ExitCode}}')) after ${i}s"
              echo "--- LOGS ---"
              docker logs "$container_id"
              echo "------------"
              docker rm -f "$container_id" || true
              exit 1
            fi
          done
          echo "FAIL: container still not running after 90s"
          echo "--- LOGS ---"
          docker logs "$container_id" || true
          echo "------------"
          docker rm -f "$container_id" || true
          exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
