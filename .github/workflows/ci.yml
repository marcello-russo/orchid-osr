name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install ".[dev]"
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/ --diff
      - run: pytest -x -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n entrypoint.sh
      - run: docker build --target=cpu -t orchid-ncd .
      - name: Smoke test — avvio container
        run: |
          docker run -d --name smoke-test orchid-ncd
          sleep 5
          if docker ps -q --filter name=smoke-test | grep -q .; then
            echo "OK: container vivo dopo 5s"
            docker rm -f smoke-test || true
          else
            echo "FAIL: container morto all'avvio"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
