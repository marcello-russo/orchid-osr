name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Un push nuovo sullo stesso ref annulla il run precedente: i minuti del runner
# non si spendono su commit già superati.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      # Stesse versioni dell'immagine: torch/torchvision dall'indice CPU
      # (un wheel CUDA da ~5 GB esaurisce il disco del runner), tutto il resto
      # dal lock. Se la CI installasse i range di pyproject, un verde qui non
      # direbbe nulla sull'immagine che va in produzione.
      - run: pip install --no-deps --index-url https://download.pytorch.org/whl/cpu -r torch-pins.txt
      - run: pip install -r requirements-dev.txt
      # Come nell'immagine: registra il comando `orchid` e valida il packaging.
      - run: pip install --no-deps .
      - run: ruff check app/ tests/ scripts/
      - run: ruff format --check app/ tests/ scripts/ --diff
      # Niente --cov-fail-under qui: la soglia è in pyproject.toml (fonte unica).
      - run: pytest -q --cov=app --cov=scripts --cov-report=term

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install mypy
      # Gate reale: `continue-on-error` rendeva il job decorativo (poteva essere
      # rosso per settimane senza bloccare nulla). Lo scope è quello che il
      # progetti tipizza oggi (app/cli, vedi overrides in pyproject): allargarlo
      # a app/core e app/api è debito dichiarato, non silenzioso.
      - run: mypy app/cli --ignore-missing-imports

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      # Allowlist motivata in backend/audit-ignores.txt: qualunque altra
      # vulnerabilità nota nelle dipendenze pinnate blocca il merge.
      - name: Dipendenze Python (pip-audit)
        run: bash scripts/ci/pip_audit.sh

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash -n entrypoint.sh
      - name: Python syntax check
        run: python3 backend/scripts/ci/check_syntax.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and cache
        uses: docker/build-push-action@v6
        with:
          target: runtime
          tags: orchid-osr
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test — health endpoint
        run: |
          container_id=$(docker run -d orchid-osr)
          for i in $(seq 1 12); do
            sleep 5
            if docker exec "$container_id" python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')" 2>/dev/null; then
              echo "OK: health endpoint risponde dopo $((i*5))s"
              docker rm -f "$container_id" || true
              exit 0
            fi
            status=$(docker inspect "$container_id" --format='{{.State.Status}}')
            if [ "$status" = "exited" ]; then
              echo "FAIL: container exited (code $(docker inspect "$container_id" --format='{{.State.ExitCode}}'))"
              docker logs "$container_id" || true
              docker rm -f "$container_id" || true
              exit 1
            fi
          done
          echo "FAIL: health endpoint non risponde dopo 60s"
          docker logs "$container_id" || true
          docker rm -f "$container_id" || true
          exit 1
      # Vulnerabilità dentro l'immagine finale (base image + wheel installati).
      # `ignore-unfixed: true`: chiediamo solo ciò per cui esiste una patch —
      # una CVE senza fix non è azionabile e bloccherebbe il progetto per sempre.
      - name: Vulnerabilità dell'immagine (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: orchid-osr
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - run: npm ci
      - run: npm run lint
      # Le traduzioni IT/EN sono un contratto: una chiave aggiunta solo da un
      # lato non deve arrivare in produzione (il fallback silenzioso la nasconde).
      - name: Traduzioni IT/EN allineate
        run: npm run check-i18n
      # 110 test già esistenti che nessuno eseguiva: girano in ~30s.
      - name: Test (vitest)
        run: npm test
      - run: npm run build

