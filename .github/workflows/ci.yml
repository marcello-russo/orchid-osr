name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install ".[dev]"
      - run: ruff check app/ tests/ scripts/
      - run: ruff format --check app/ tests/ scripts/ --diff
      - run: pytest -x -q --cov=app --cov-report=term --cov-fail-under=60

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n entrypoint.sh
      - name: Python syntax check
        run: python -c "
import ast, pathlib
errors = 0
for f in sorted(pathlib.Path('backend/scripts').rglob('*.py')):
    try:
        ast.parse(f.read_text())
        print(f'  OK  {f}')
    except SyntaxError as e:
        print(f'  FAIL {f}: {e}')
        errors += 1
exit(errors)
"
      - run: docker build --target=cpu -t orchid-ncd .
      - name: Smoke test — avvio container
        run: |
          docker run -d --name smoke-test orchid-ncd
          sleep 5
          if docker ps -q --filter name=smoke-test | grep -q .; then
            echo "OK: container vivo dopo 5s"
            docker rm -f smoke-test || true
          else
            echo "FAIL: container morto all'avvio"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
