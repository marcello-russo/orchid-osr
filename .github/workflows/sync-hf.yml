name: Sync to Hugging Face

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  sync-space:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Push to HF Spaces
        run: |
          git remote add hf https://marcellorusso:$HF_TOKEN@huggingface.co/spaces/marcellorusso/orchid-ncd
          git push hf main
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
