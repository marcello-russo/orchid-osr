# Lo stage `training` (CUDA 12.1, Python 3.10) non è quello di produzione e
# nessun workflow lo costruiva: un constraint rotto o una dipendenza che alza
# il minimo di Python si scopriva solo al primo `compose.training.yml run`,
# cioè con la GPU accesa e il dataset già scaricato.
#
# Non gira a ogni push (l'immagine base CUDA pesa ~3 GB): una volta a settimana,
# a mano, e quando cambia qualcosa che lo riguarda.
name: Training image

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - backend/pyproject.toml
      - backend/constraints-training.txt
      - compose.training.yml
      - entrypoint.sh

permissions:
  contents: read

env:
  IMAGE: orchid-osr-training

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build dello stage training
        uses: docker/build-push-action@v7
        with:
          context: .
          target: training
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=training
          cache-to: type=gha,mode=max,scope=training
      # Non basta che l'immagine si costruisca: il rischio vero è un pacchetto
      # che si installa ma non si importa (era il caso dei transformers
      # declassati a risoluzione finita). Si importa tutto ciò che serve al
      # training, dal WORKDIR dell'immagine.
      - name: Import di torch, transformers e del codice applicativo
        run: |
          docker run --rm --entrypoint python3 "$IMAGE" -c "
          import torch, torchvision, transformers, peft, numpy, sklearn
          import app.core.models
          print('torch', torch.__version__, '| transformers', transformers.__version__)
          print('cuda wheel:', torch.version.cuda)
          "
