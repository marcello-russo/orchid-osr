# Lo stage `training` (CUDA 12.1, Python 3.10) non è quello di produzione e
# nessun workflow lo costruiva: un constraint rotto o una dipendenza che alza
# il minimo di Python si scopriva solo al primo `compose.training.yml run`,
# cioè con la GPU accesa e il dataset già scaricato.
#
# Non gira a ogni push (l'immagine base CUDA pesa ~3 GB): una volta a settimana,
# a mano, e quando cambia qualcosa che lo riguarda.
name: Training image

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - backend/pyproject.toml
      - backend/constraints-training.txt
      - compose.training.yml
      - entrypoint.sh

permissions:
  contents: read

env:
  IMAGE: orchid-osr-training

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # L'immagine training pesa 11,7 GB (misurata) e buildx la esporta in un
      # tarball OCI prima di importarla nel docker del runner: durante
      # l'import servono più del doppio dello spazio finale. Su un runner
      # appena acceso il build è morto lì — `no space left on device` — dopo
      # aver costruito tutto per davvero (tutti gli stage verdi, poi il
      # fallimento nell'importing to docker). Qui si tolgono i toolchain
      # preinstallati che questo job non usa: la lista è quella di
      # jlumbroso/free-disk-space, senza dipendere da un'azione di terzi che
      # può cambiare sotto.
      - name: Libera disco (l'immagine CUDA non ci sta due volte)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost
          docker image prune -af >/dev/null || true
          free=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "spazio libero dopo la pulizia: ${free}G"
          if [ "$free" -lt 30 ]; then
            echo "::error::servono almeno 30G liberi per costruire e caricare l'immagine: ce ne sono ${free}G"
            exit 1
          fi
          df -h / | tail -1
      - uses: docker/setup-buildx-action@v4
      - name: Build dello stage training
        uses: docker/build-push-action@v7
        with:
          context: .
          target: training
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=training
          cache-to: type=gha,mode=max,scope=training
      # Non basta che l'immagine si costruisca: il rischio vero è un pacchetto
      # che si installa ma non si importa (era il caso dei transformers
      # declassati a risoluzione finita). Si importa tutto ciò che serve al
      # training, dal WORKDIR dell'immagine.
      - name: Import di torch, transformers e del codice applicativo
        run: |
          docker run --rm --entrypoint python3 "$IMAGE" -c "
          import torch, torchvision, transformers, peft, numpy, sklearn
          import app.core.models
          print('torch', torch.__version__, '| transformers', transformers.__version__)
          print('cuda wheel:', torch.version.cuda)
          "
