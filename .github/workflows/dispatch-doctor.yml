# TEMPORANEO — diagnosi del DISPATCH_TOKEN. Da cancellare dopo l'uso.
name: Dispatch doctor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - name: Cosa vede GitHub con questo token
        env:
          T: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -uo pipefail
          echo "len=${#T} prefix=${T:0:4} suffix=${T: -2}"
          echo "== identita del token"
          curl -s -H "Authorization: Bearer $T" https://api.github.com/user \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('login') or d, d.get('type',''))"
          echo "== repo actions visibile?"
          curl -s -o /dev/null -w 'GET /repos/marcello-russo/actions -> %{http_code}\n' \
            -H "Authorization: Bearer $T" https://api.github.com/repos/marcello-russo/actions
          echo "== dispatch: header accettati"
          curl -s -D - -o /dev/null -X POST \
            -H "Authorization: Bearer $T" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/marcello-russo/actions/dispatches \
            -d '{"event_type":"doctor-probe"}' \
            | grep -iE "^HTTP/|x-accepted-github-permissions|x-oauth-scopes|x-ratelimit-limit" || true
