repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy strict
        entry: mypy --strict backend/app/cli backend/app/core --ignore-missing-imports
        language: system
        pass_filenames: false
