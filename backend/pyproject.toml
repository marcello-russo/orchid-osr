[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "orchid-osr"
version = "0.1.0"
description = "Ultra-fine-grained classification of Ophrys orchids via deep learning"
requires-python = ">=3.10"
dependencies = [
    "bcrypt==4.2.1",
    "captum",
    "fastapi",
    "httpx",
    "huggingface_hub",
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "peft>=0.10.0,<0.20.0",
    "pillow",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyjwt==2.10.1",
    "python-dotenv",
    "python-multipart",
    "scikit-learn",
    "scipy",
    "slowapi>=0.1.9",
    "torch",
    "torchvision",
    "transformers>=4.40.0,<5.0.0",
    "uvicorn",
]

[project.scripts]
orchid = "app.cli.main:app"
orchid-osr = "app.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff~=0.5.0",
]
ml = [
    "jupyter",
    "notebook",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"app/explainability/*" = ["E501", "F841", "E402", "F401"]
"app/preprocessing/*" = ["E501", "F401", "E402"]
"app/preprocessing_tools.py" = ["E402", "F401"]
"app/core/kfold/*" = ["E501", "F401", "E741"]
"app/core/ncd/*" = ["F841"]
"app/core/training.py" = ["F401"]
"app/core/supcon.py" = ["F401"]
"app/cli/experiments.py" = ["I001"]
"tests/test_integration/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
omit = ["app/figures/*", "app/api/*"]

[tool.coverage.report]
fail_under = 50

[tool.mypy]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.api.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.core.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.preprocessing.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.visualization.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.explainability.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.config"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.cli.experiments"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.cli.reports"
ignore_errors = true

# B-temp: new Typer CLI still untyped — strict deferred post-Exp5
[[tool.mypy.overrides]]
module = "app.cli.runner"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.cli.definitions"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.cli.commands.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.cli.main"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
timeout_method = "thread"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "api: marks API integration tests (require server running)",
]
addopts = "-m 'not slow'"
