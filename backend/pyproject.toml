[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "orchid-osr"
version = "0.1.0"
description = "Ultra-fine-grained classification of Ophrys orchids via deep learning"
requires-python = ">=3.10"
dependencies = [
    "bcrypt==4.2.1",
    "captum",
    "fastapi",
    "httpx",
    "huggingface_hub",
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "peft>=0.10.0,<0.20.0",
    "pillow",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.15.0,<3",
    "python-dotenv",
    "python-multipart",
    "scikit-learn",
    "scipy",
    "slowapi>=0.1.9",
    "torch",
    "torchvision",
    "transformers>=4.40.0,<5.0.0",
    "typer",
    "uvicorn",
]

[project.scripts]
orchid = "app.cli.main:app"
orchid-osr = "app.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.3.0",
    "ruff~=0.5.0",
]
ml = [
    "jupyter",
    "notebook",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
# Le figure della tesi non si misurano a righe: sono plotting puro, verificate
# dal check phash (orchid figures --check). L'API invece si misura: era esclusa
# e la route di /api/experiments (548 righe) non era coperta da nessun test.
omit = ["app/figures/*"]

[tool.coverage.report]
# Misurato: 49% (505 test, `pytest -m "not slow"`, branch coverage). La soglia
# sta 3 punti sotto, non a 0: così una regressione reale (API o preprocessing
# che perdono i test) fa fallire la CI, mentre aggiungere codice di training
# non ancora testabile non la fa fallire per un decimale. Unica fonte: la CI
# non passa più `--cov-fail-under` (averla in due posti l'aveva fatta divergere).
fail_under = 46
show_missing = true

[tool.mypy]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.api.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.core.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.preprocessing.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.visualization.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.explainability.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.config"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.cli.experiments"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.cli.reports"
ignore_errors = true

# B-temp: new Typer CLI still untyped — strict deferred post-Exp5
[[tool.mypy.overrides]]
module = "app.cli.runner"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.cli.definitions"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.cli.commands.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.cli.main"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
timeout_method = "thread"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "api: marks API integration tests (require server running)",
]
addopts = "-m 'not slow'"
