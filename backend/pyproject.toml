[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "orchid-ncd"
version = "0.1.0"
description = "Ultra-fine-grained classification of Ophrys orchids via deep learning"
requires-python = ">=3.10"
dependencies = [
    "bcrypt==4.2.1",
    "captum",
    "fastapi",
    "httpx",
    "huggingface_hub",
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "peft>=0.10.0",
    "pillow",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyjwt==2.10.1",
    "python-dotenv",
    "python-multipart",
    "scikit-learn",
    "scipy",
    "slowapi>=0.1.9",
    "torch",
    "torchvision",
    "transformers>=4.40.0",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.5.0",
]
ml = [
    "jupyter",
    "notebook",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"app/explainability/*" = ["E501", "F841", "E402", "F401"]
"app/preprocessing/*" = ["E501", "F401", "E402"]
"app/preprocessing_tools.py" = ["E402", "F401"]
"app/core/kfold/*" = ["E501", "F401", "E741"]
"app/core/ncd/*" = ["F841"]
"app/core/training.py" = ["F401"]
"app/core/supcon.py" = ["F401"]
"app/cli/experiments.py" = ["I001"]
"tests/test_integration/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "api: marks API integration tests (require server running)",
]
addopts = "-m 'not slow'"
